name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: drumandbytes/reusable-actions/.github/workflows/python-action-ci.yml@v1
    with:
      test-dependencies: "pytest pytest-asyncio 'aiohttp>=3.9.0,<3.12' pyyaml packaging aioresponses"
      required-files: |
        action.yml
        .github/scripts/update_versions.py

  security:
    uses: drumandbytes/reusable-actions/.github/workflows/security-scan.yml@v1
